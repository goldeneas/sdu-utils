<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>Cards screen UI mock</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #0e0f0c;
    --muted: #454745;
    --green: #163300;
    --lime: #9fe870;
    --line: #d3d3cf;
    --safe-top: env(safe-area-inset-top, 0px);
    --font: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body {
    margin: 0; color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.25;
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  h1, p { margin: 0; }

  .app { max-width: 430px; margin: 0 auto; padding: calc(var(--safe-top) + 75px) 16px 100px; position: relative; }

  /* ---------- top bar ---------- */
  .topbar {
    position: fixed; z-index: 10; top: 0; left: 0; right: 0; max-width: 430px; margin: 0 auto;
    height: calc(var(--safe-top) + 69px);
    padding: calc(var(--safe-top) + 12px) 16px 0;
    background: var(--bg);
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .pill {
    height: 45px; padding: 0 17px 0 14px; border-radius: 23px;
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 14.5px; font-weight: 600; color: var(--muted);
    background: #fcfcfb; border: 1px solid #d9d9d5;
    box-shadow: 0 2px 8px rgba(14, 15, 12, .07);
  }
  .pill.lime {
    background: var(--lime); border-color: #8fdc60; color: var(--green);
    padding: 0 17px; box-shadow: 0 2px 10px rgba(120, 220, 80, .35);
  }
  .mini-title {
    position: absolute; left: 0; right: 0; top: calc(var(--safe-top) + 12px); height: 45px;
    display: grid; place-items: center; pointer-events: none;
    font-size: 18px; font-weight: 500; opacity: 0;
  }

  /* ---------- title + card ---------- */
  h1 { margin-top: 7px; font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -.02em; }

  .carousel { position: relative; margin-top: 15.5px; height: 189px; }
  .peek {
    position: absolute; left: -56px; top: 0; width: 63px; height: 189px;
    border: 3px solid var(--green); border-radius: 18px; background: #e9ebe7;
  }
  .card {
    position: absolute; left: 30px; top: 0; width: 300px; height: 189px;
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 18px 38px rgba(80, 60, 10, .16);
  }
  .card svg { display: block; width: 100%; height: 100%; }

  .label { margin-top: 26.5px; display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 15.5px; line-height: 20px; }
  .label b { font-weight: 700; }
  .label .dots { letter-spacing: 1px; font-weight: 700; margin-right: -4px; }

  /* ---------- quick actions ---------- */
  .actions { margin-top: 42px; display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
  .act { display: flex; flex-direction: column; align-items: center; }
  .act .c {
    width: 56px; height: 56px; border-radius: 50%; background: var(--lime); color: var(--green);
    display: grid; place-items: center;
  }
  .act span.t { margin-top: 10px; font-size: 14.5px; line-height: 20px; font-weight: 600; color: var(--green); }
  .wallet { margin-top: 19px; text-align: center; color: var(--muted); font-size: 14.5px; line-height: 20px; }

  /* ---------- manage list ---------- */
  .manage { margin-top: 41px; font-size: 14.5px; line-height: 20px; color: var(--muted); padding-bottom: 6px; border-bottom: 1.5px solid #e1e1de; }
  .list { margin-top: 17.5px; }
  .item {
    width: 100%; height: 48px; margin-bottom: 32.6px;
    display: flex; align-items: center; text-align: left;
  }
  .item .ic {
    width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff;
    display: grid; place-items: center; flex: none; color: var(--ink);
  }
  .item .tx { margin-left: 15px; flex: 1; font-size: 16px; font-weight: 600; letter-spacing: -.005em; }
  .item .chev { margin-right: 6px; color: var(--green); }

  /* ---------- floating tab bar ---------- */
  .tabbar {
    position: fixed; z-index: 10; left: 0; right: 0; bottom: 23px; margin: 0 auto;
    width: min(351px, calc(100% - 42px)); height: 62.5px;
    display: grid; grid-template-columns: repeat(4, 1fr); padding: 0 9px; align-items: center;
    background: rgba(255, 255, 255, .88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid #dcdcd8; border-radius: 32px;
    box-shadow: 0 6px 24px rgba(14, 15, 12, .10);
  }
  .tab {
    position: relative; z-index: 1; height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 11.5px; line-height: 14px; font-weight: 500; color: var(--ink); letter-spacing: .01em;
  }
  .tab.on::before {
    content: ""; position: absolute; z-index: -1; left: 50%; top: 0; width: 93px; height: 54px; margin-left: -46.5px;
    border-radius: 27px; background: #e8e8e5;
  }

  .demo {
    position: fixed; z-index: 20; left: 50%; bottom: 4px; transform: translateX(-50%);
    font-size: 9.5px; line-height: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    background: rgba(14, 15, 12, .86); color: #fff; padding: 0 9px; border-radius: 999px; white-space: nowrap; pointer-events: none;
  }
</style>
</head>
<body>

<header class="topbar">
  <button class="pill" type="button">
    <svg width="18" height="20" viewBox="0 0 20 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="12" height="12" rx="2.500"/><path d="M7.500 6V3h5v3M7.500 10h5M7 18v2M13 18v2"/></svg>
    Travel hub
  </button>
  <div class="mini-title" id="mini">Cards</div>
  <button class="pill lime" type="button">Card</button>
</header>

<main class="app">
  <h1>Cards</h1>

  <div class="carousel">
    <div class="peek"></div>
    <div class="card">
      <svg viewBox="0 0 300 189" aria-label="Placeholder card artwork">
        <defs>
          <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#e29a35"/><stop offset=".5" stop-color="#eebb3b"/><stop offset="1" stop-color="#d9972f"/>
          </linearGradient>
          <linearGradient id="wave" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#f2c940"/><stop offset=".5" stop-color="#f7d553"/><stop offset="1" stop-color="#f0c842"/>
          </linearGradient>
          <linearGradient id="lower" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#e98a35"/><stop offset=".55" stop-color="#eeb43f"/><stop offset="1" stop-color="#b3c050"/>
          </linearGradient>
          <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
          <!-- wobbly, painterly edges -->
          <filter id="paint" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency=".025 .06" numOctaves="3" seed="7" result="t"/>
            <feDisplacementMap in="SourceGraphic" in2="t" scale="14" xChannelSelector="R" yChannelSelector="G"/>
            <feGaussianBlur stdDeviation=".7"/>
          </filter>
          <filter id="mist" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency=".04 .08" numOctaves="3" seed="3" result="t"/>
            <feDisplacementMap in="SourceGraphic" in2="t" scale="9" xChannelSelector="R" yChannelSelector="G"/>
            <feGaussianBlur stdDeviation="1.6"/>
          </filter>
          <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
          <filter id="streak" x="-10%" y="-50%" width="120%" height="200%">
            <feTurbulence type="fractalNoise" baseFrequency=".02 .5" numOctaves="2" seed="11" result="t"/>
            <feDisplacementMap in="SourceGraphic" in2="t" scale="5" xChannelSelector="R" yChannelSelector="G"/>
            <feGaussianBlur stdDeviation=".35"/>
          </filter>
          <!-- canvas weave + speckle -->
          <filter id="canvas" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency=".55 .9" numOctaves="3" seed="2" result="n"/>
            <feDiffuseLighting in="n" lighting-color="#fff" surfaceScale="1.6" result="l"><feDistantLight azimuth="235" elevation="58"/></feDiffuseLighting>
          </filter>
          <filter id="speckle" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="1" seed="9"/>
            <feColorMatrix type="matrix" values="0 0 0 0 .95  0 0 0 0 .86  0 0 0 0 .5  0 0 0 1.8 -.78"/>
          </filter>
          <clipPath id="cardclip"><rect width="300" height="189" rx="18"/></clipPath>
        </defs>

        <g clip-path="url(#cardclip)">
          <rect width="300" height="189" fill="url(#base)"/>

          <!-- misty skyline, upper left -->
          <g filter="url(#mist)" opacity=".7" fill="#6f7a68">
            <path d="M-10 120V84l8-3v-8h6v8l8 3v-18h10v18l6-2v-12h8v12l4 2v-30h8v30l5-1V74l9-10 4-16 2-14h2l2 14 4 16 9 10v52z"/>
            <path d="M92 130V92l6-4 4-18 8-18c3-8 8-12 12-12s9 4 12 12l8 18 4 18 6 4v38z"/>
            <rect x="116" y="18" width="2.600" height="22"/>
            <path d="M128 130V100l6-2v-8h6v8l8 2v30z"/>
          </g>
          <g filter="url(#mist)" opacity=".5" fill="#a9ad8d">
            <path d="M0 100l12-4 10 3 12-7 14 5 12-5 18 6 12-4 22 8v40H0z"/>
          </g>
          <!-- tree mass / warm maroon accent -->
          <g filter="url(#soft)" opacity=".85">
            <ellipse cx="90" cy="108" rx="24" ry="34" fill="#932f3f"/>
            <ellipse cx="72" cy="96" rx="14" ry="20" fill="#b2503f" opacity=".7"/>
            <ellipse cx="60" cy="124" rx="30" ry="14" fill="#c8662f" opacity=".6"/>
          </g>
          <g filter="url(#paint)" fill="#9b3443" opacity=".5">
            <path d="M78 78c10-6 22-4 28 6 6 12 2 26-6 36-8 8-14 10-22 4-10-10-12-34 0-46z"/>
          </g>

          <!-- big pale sweep -->
          <g filter="url(#paint)">
            <path d="M136 189C138 132 176 98 226 70 260 50 286 30 312 12V0H128c-10 40 0 72 6 108 4 28 3 56 2 81z" fill="url(#wave)" opacity=".78"/>
            <path d="M118 189C130 150 168 112 232 98 266 91 290 84 312 70V189z" fill="url(#lower)" opacity=".85"/>
            <path d="M0 189V140c26 4 52 20 84 38 14 8 22 11 34 11z" fill="#ea8a37" opacity=".85"/>
          </g>
          <g filter="url(#paint)" opacity=".55">
            <path d="M118 189C150 160 200 140 252 138 276 137 296 132 312 124" fill="none" stroke="#fbe58a" stroke-width="10" stroke-linecap="round"/>
            <path d="M160 40C200 30 252 22 312 -2" fill="none" stroke="#e0903a" stroke-width="12" stroke-linecap="round" opacity=".6"/>
          </g>

          <!-- brush streaks, bottom -->
          <g filter="url(#streak)" fill="none" stroke-linecap="round">
            <path d="M-6 178C40 170 90 172 150 174" stroke="#d7502e" stroke-width="1.200" opacity=".85"/>
            <path d="M10 183C70 176 130 178 190 182" stroke="#b83a2b" stroke-width=".8" opacity=".7"/>
            <path d="M-4 168C50 162 100 166 140 168" stroke="#f0a23c" stroke-width="3" opacity=".6"/>
            <path d="M130 186C190 176 250 178 312 172" stroke="#8ea23d" stroke-width="4" opacity=".45"/>
            <path d="M200 160C240 156 280 158 312 154" stroke="#c9d062" stroke-width="3" opacity=".5"/>
          </g>

          <!-- grain / canvas -->
          <rect width="300" height="189" filter="url(#canvas)" style="mix-blend-mode:soft-light" opacity=".6"/>
          <rect width="300" height="189" filter="url(#speckle)" opacity=".7"/>
          <rect width="300" height="189" fill="url(#gloss)"/>
          <rect x=".5" y=".5" width="299" height="188" rx="17.500" fill="none" stroke="#fff" stroke-opacity=".28"/>
        </g>

        <text x="286" y="49" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="900" font-style="italic" fill="#fff" letter-spacing="-2" style="paint-order:stroke" stroke="#c88a1c" stroke-opacity=".25" stroke-width=".6">demo</text>
        <text x="286" y="166" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900" font-style="italic" fill="#fff" letter-spacing="-1">CARD</text>
      </svg>
    </div>
  </div>

  <div class="label"><b>Digital card</b><span><span class="dots">&bull;&bull;&bull;&bull;</span> 0000</span></div>

  <div class="actions">
    <button class="act" type="button">
      <span class="c">
        <svg width="26" height="30" viewBox="0 0 26 30" fill="currentColor"><circle cx="5" cy="5" r="2.600"/><circle cx="13" cy="5" r="2.600"/><circle cx="21" cy="5" r="2.600"/><circle cx="5" cy="12" r="2.600"/><circle cx="13" cy="12" r="2.600"/><circle cx="21" cy="12" r="2.600"/><circle cx="5" cy="19" r="2.600"/><circle cx="13" cy="19" r="2.600"/><circle cx="21" cy="19" r="2.600"/><circle cx="13" cy="26" r="2.600"/></svg>
      </span>
      <span class="t">Show PIN</span>
    </button>
    <button class="act" type="button">
      <span class="c">
        <svg width="30" height="26" viewBox="0 0 30 26" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h20a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8 10h7M8 15h14"/></svg>
      </span>
      <span class="t">Card details</span>
    </button>
    <button class="act" type="button">
      <span class="c">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3v24M4.600 9l20.800 12M4.600 21L25.400 9"/><path d="M11.500 4.500L15 8l3.500-3.500M11.500 25.500L15 22l3.500 3.500M3.500 14.500L8 15 6.500 10M26.500 15.500L22 15l1.500 5M3.500 15.500L8 15l-1.500 5M26.500 14.500L22 15l1.500-5"/></svg>
      </span>
      <span class="t">Freeze card</span>
    </button>
  </div>

  <p class="wallet">Added to phone wallet</p>

  <p class="manage">Manage card</p>

  <div class="list">
    <button class="item" type="button">
      <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="4.500" cy="6" r=".8" fill="currentColor"/><circle cx="4.500" cy="12" r=".8" fill="currentColor"/><circle cx="4.500" cy="18" r=".8" fill="currentColor"/><path d="M9 6h12M9 12h12M9 18h12"/></svg></span>
      <span class="tx">View recent card transactions</span>
      <svg class="chev" width="12" height="18" viewBox="0 0 12 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2l7 7-7 7"/></svg>
    </button>
    <button class="item" type="button">
      <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.400 15a1.650 1.650 0 0 0 .33 1.820l.06.06a2 2 0 0 1 0 2.830 2 2 0 0 1-2.830 0l-.06-.06a1.650 1.650 0 0 0-1.820-.33 1.650 1.650 0 0 0-1 1.510V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.650 1.650 0 0 0 9 19.400a1.650 1.650 0 0 0-1.820.33l-.06.06a2 2 0 0 1-2.830 0 2 2 0 0 1 0-2.830l.06-.06a1.650 1.650 0 0 0 .33-1.820 1.650 1.650 0 0 0-1.510-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.650 1.650 0 0 0 4.600 9a1.650 1.650 0 0 0-.33-1.820l-.06-.06a2 2 0 0 1 0-2.830 2 2 0 0 1 2.830 0l.06.06a1.650 1.650 0 0 0 1.820.33H9a1.650 1.650 0 0 0 1-1.510V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.650 1.650 0 0 0 1 1.510 1.650 1.650 0 0 0 1.820-.33l.06-.06a2 2 0 0 1 2.830 0 2 2 0 0 1 0 2.830l-.06.06a1.650 1.650 0 0 0-.33 1.820V9a1.650 1.650 0 0 0 1.510 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.650 1.650 0 0 0-1.510 1z"/></svg></span>
      <span class="tx">Card controls</span>
      <svg class="chev" width="12" height="18" viewBox="0 0 12 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2l7 7-7 7"/></svg>
    </button>
    <button class="item" type="button">
      <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.500" y="11" width="15" height="10" rx="2"/><path d="M8 11V7.500a4 4 0 0 1 7.700-1.500"/><path d="M12 15v2.500"/></svg></span>
      <span class="tx">Unblock PIN</span>
      <svg class="chev" width="12" height="18" viewBox="0 0 12 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2l7 7-7 7"/></svg>
    </button>
    <button class="item" type="button">
      <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4.500L16.500 4a2.100 2.100 0 0 1 3 3L8 18.500z"/><path d="M14 6.500l3.500 3.500"/></svg></span>
      <span class="tx">Edit card</span>
      <svg class="chev" width="12" height="18" viewBox="0 0 12 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2l7 7-7 7"/></svg>
    </button>
    <button class="item" type="button">
      <span class="ic"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20.500a10 10 0 1 1 16 0"/><circle cx="13" cy="15" r="2"/><path d="M14.500 13.500L18 9.500"/></svg></span>
      <span class="tx">Your spending limits</span>
      <svg class="chev" width="12" height="18" viewBox="0 0 12 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2l7 7-7 7"/></svg>
    </button>
    <button class="item" type="button">
      <span class="ic"><svg width="26" height="22" viewBox="0 0 26 22" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h18a2 2 0 0 1 2 2v3.500a2 2 0 0 0 0 5V16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M6 8h7"/></svg></span>
      <span class="tx">Replace card</span>
      <svg class="chev" width="12" height="18" viewBox="0 0 12 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2l7 7-7 7"/></svg>
    </button>
    <button class="item" type="button">
      <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.500 7h15M9.500 7V4.500h5V7M6.500 7l.8 13h9.400l.8-13"/></svg></span>
      <span class="tx">Delete card</span>
      <svg class="chev" width="12" height="18" viewBox="0 0 12 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2l7 7-7 7"/></svg>
    </button>
  </div>
</main>

<nav class="tabbar">
  <button class="tab" type="button">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linejoin="round"><path d="M3.500 12.500L13 4l9.500 8.500V22h-19z"/></svg>Home
  </button>
  <button class="tab on" type="button">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h18a1 1 0 0 1 1 1v4.500a2.500 2.500 0 0 0 0 5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M7 10h6"/></svg>Cards
  </button>
  <button class="tab" type="button">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="9" r="3.500"/><path d="M3.500 21c0-3.800 3-6 6.500-6s6.500 2.200 6.500 6"/><path d="M16.500 5.500a3.500 3.500 0 0 1 0 7M19.500 15.500c2 .8 3 2.700 3 5.500"/></svg>Recipients
  </button>
  <button class="tab" type="button">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><circle cx="16.500" cy="6" r="2.500"/><circle cx="7" cy="19" r="2.500"/><circle cx="20" cy="19.500" r="2.500"/><path d="M13 7.500C7 8 4 12 4.500 14.500M17 21.500h-5M18.500 9.500c2.500 2 3.500 4 3.500 7"/></svg>Payments
  </button>
</nav>

<div class="demo">UI mock &middot; placeholder data</div>

<script>
  var mini = document.getElementById('mini');
  function onScroll() {
    var t = Math.min(1, Math.max(0, (window.scrollY - 70) / 40));
    mini.style.opacity = t;
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
</script>
</body>
</html>
