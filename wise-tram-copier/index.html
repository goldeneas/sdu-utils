<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<meta name="robots" content="noindex">
		<meta name="theme-color" content="#f2f2ef">
		<title>Payment screen UI mock</title>
		<style>
			:root {
				--bg: #f2f2ef;
				--sheet: #ffffff;
				--ink: #0e0f0c;
				--muted: #454745;
				--green: #163300;
				--line: #d3d3cf;
				--card: #f7f7f5;
				--safe-top: env(safe-area-inset-top, 0px);
				--radius-sheet: 28px;
				--font: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
			}
			
			* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
			html { background: var(--bg); }
			body {
				margin: 0;
				background: var(--bg);
				color: var(--ink);
				font-family: var(--font);
				font-size: 16px;
				line-height: 1.25;
				-webkit-font-smoothing: antialiased;
				-webkit-text-size-adjust: 100%;
			}
			button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
			h1, h2, p { margin: 0; }
			
			.app { max-width: 430px; margin: 0 auto; min-height: 100vh; }
			
			/* ---------- fixed top bar ---------- */
			.topbar {
				position: fixed; z-index: 10;
				top: 0; left: 0; right: 0;
				max-width: 430px; margin: 0 auto;
				height: calc(var(--safe-top) + 75px);
				padding: calc(var(--safe-top) + 12px) 16px 0;
				background: var(--bg);
				display: flex; align-items: flex-start; justify-content: space-between;
			}
			/* inverse rounded corners so the sheet looks like it slides under the bar */
			.topbar::after {
				content: ""; position: absolute; left: 0; right: 0; top: 100%; height: var(--radius-sheet);
				pointer-events: none;
				background:
				radial-gradient(circle at 100% 100%, transparent calc(var(--radius-sheet) - .5px), var(--bg) var(--radius-sheet)) left top / var(--radius-sheet) var(--radius-sheet) no-repeat,
				radial-gradient(circle at 0 100%, transparent calc(var(--radius-sheet) - .5px), var(--bg) var(--radius-sheet)) right top / var(--radius-sheet) var(--radius-sheet) no-repeat;
			}
			.icon-btn {
				width: 45px; height: 45px; border-radius: 50%;
				display: grid; place-items: center;
				background: #f7f7f5;
				border: 1px solid #d9d9d5;
				box-shadow: 0 1px 3px rgba(14, 15, 12, .08);
				color: var(--green);
			}
			.icon-btn:active { background: #ebebe7; }
			.icon-btn svg { display: block; }
			.actions { display: flex; gap: 11px; }
			
			.mini-title {
				position: absolute; left: 0; right: 0; top: calc(var(--safe-top) + 12px);
				height: 45px; text-align: center; pointer-events: none;
				opacity: 0; transform: translateY(4px);
				display: flex; flex-direction: column; justify-content: center; align-items: center;
			}
			.mini-title strong { font-size: 22px; line-height: 26px; font-weight: 700; letter-spacing: -.01em; }
			.mini-title span { font-size: 12.5px; line-height: 14px; color: var(--muted); }
			
			/* ---------- hero ---------- */
			.hero {
				padding-top: calc(var(--safe-top) + 75px);
				display: flex; flex-direction: column; align-items: center;
			}
			.logo { width: 72px; height: 72px; display: block; }
			.amount {
				margin-top: 14px;
				font-size: 31px; line-height: 40px; font-weight: 700; letter-spacing: -.02em;
			}
			.merchant { font-size: 16px; line-height: 20px; color: var(--muted); }
			.chip {
				margin-top: 16px;
				height: 32px; padding: 3px 14px 3px 4px;
				display: inline-flex; align-items: center; gap: 8px;
				border: 1px solid #d3d3cf; border-radius: 16px;
				background: #f5f5f2;
				font-size: 16px; font-weight: 600; color: var(--muted);
			}
			.chip .dot {
				width: 24px; height: 24px; border-radius: 50%;
				background: #e9b886; display: grid; place-items: center; color: #3a2a12;
			}
			
			/* ---------- sheet ---------- */
			.sheet {
				margin-top: 33px;
				background: var(--sheet);
				border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
				padding: 15px 16px 64px;
				min-height: calc(100vh - 360px);
			}
			
			.split {
				width: 100%; height: 83px; padding: 0 20px 0 16px;
				display: flex; align-items: center; justify-content: space-between;
				background: var(--card);
				border: 1.5px dashed #d3d3cf; border-radius: 16px;
				text-align: left;
			}
			.split .t { font-size: 16px; line-height: 22px; font-weight: 700; letter-spacing: -.01em; }
			.split .s { margin-top: 5px; font-size: 14px; line-height: 22px; color: var(--muted); }
			.split .right { display: flex; align-items: center; }
			.avatars { display: flex; align-items: center; margin-right: 11px; }
			.avatars .a {
				width: 40px; height: 40px; border-radius: 50%;
				background: #fff; border: 1px solid var(--line);
				display: grid; place-items: center; font-weight: 700; font-size: 17px; color: var(--ink);
			}
			.avatars .a + .a { margin-left: -4px; }
			.avatars .a:first-child { letter-spacing: -.01em; padding-right: 3px; }
			
			h2 {
				font-size: 22px; line-height: 30px; font-weight: 700; letter-spacing: -.02em;
				margin: 40px 0 15px;
			}
			
			.row {
				display: flex; align-items: center; justify-content: space-between;
				height: 40.4px; font-size: 15.6px;
			}
			.row .k { color: var(--muted); }
			.row .v { color: var(--ink); display: flex; align-items: center; gap: 4px; }
			.row .v.strong { font-weight: 700; color: var(--muted); }
			.link { font-size: 17px; color: var(--green); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1.5px; }
			.card-chip { width: 25px; height: 17px; border-radius: 3px; background: linear-gradient(135deg, #f1de6b, #e8cf55); }
			.badge {
				height: 16px; padding: 0 3px; border: 1px solid var(--ink); border-radius: 3px;
				font-size: 9px; font-weight: 700; letter-spacing: .02em; display: grid; place-items: center; margin-left: 2px;
			}
			
			.receipt {
				margin-top: 24px; width: 100%; height: 82px;
				display: flex; align-items: center; text-align: left;
				padding: 0 16px 0 17px;
				border: 1.5px solid #8b8c89; border-radius: 16px;
				background: #fff;
			}
			.receipt .ic { width: 18px; margin-right: 20.5px; color: var(--green); display: grid; place-items: center; }
			.receipt .rt { font-size: 16px; line-height: 22px; font-weight: 700; color: var(--green); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1.5px; }
			.receipt .rs { margin-top: 6px; font-size: 14px; line-height: 20px; color: var(--muted); }
			
			.flag { width: 25px; height: 25px; display: block; }
			.paid-row { margin-top: 0; }
			
			.foot { text-align: center; color: var(--muted); font-size: 15.6px; line-height: 20px; margin-top: 25px; }
			.foot p + p { margin-top: 10px; text-transform: uppercase; }
			
			/* ---------- demo label ---------- */
			.demo {
				position: fixed; z-index: 20; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
				transform: translateX(-50%);
				background: rgba(14, 15, 12, .86); color: #fff;
				font-size: 11px; line-height: 1; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
				padding: 7px 12px; border-radius: 999px; white-space: nowrap; pointer-events: none;
			}
		</style>
		<link rel="manifest" href="manifest.webmanifest">
		<link rel="apple-touch-icon" href="icons/icon-180.png">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-title" content="UI Mock">
		<script src="pwa.js" defer></script>
		<script src="config.js"></script>
	</head>
	<body>

		<header class="topbar" id="topbar">
			<button class="icon-btn" aria-label="Back">
				<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M11 5l-7 7 7 7"/></svg>
			</button>

			<div class="mini-title" id="mini"><strong data-cfg="payment.amountText">25 DKK</strong><span data-cfg="payment.merchant">Demo Transit</span></div>

			<div class="actions">
				<button class="icon-btn" aria-label="Help">
					<svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="13" r="10.5"/><path d="M10.2 10.4a3 3 0 1 1 4.4 2.6c-.9.5-1.6 1.2-1.6 2.3"/><circle cx="13" cy="18.6" r=".6" fill="currentColor"/></svg>
				</button>
				<button class="icon-btn" aria-label="More">
					<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="4.5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19.5" cy="12" r="2"/></svg>
				</button>
			</div>
		</header>

		<div class="app">
			<section class="hero">
				<svg class="logo" viewBox="0 0 72 72" aria-hidden="true">
					<circle cx="36" cy="36" r="36" fill="#0b2431"/>
					<g transform="translate(8 0) skewX(-14)">
						<path fill="#8bc34a" fill-rule="evenodd" d="M23.500 20H55.500V29H33.500V32H50.500V41H33.500V52H23.500Z"/>
					</g>
				</svg>
				<h1 class="amount" data-cfg="payment.amountText">25 DKK</h1>
				<p class="merchant" data-cfg="payment.merchant">Demo Transit</p>
				<div class="chip">
					<span class="dot">
						<svg width="14" height="16" viewBox="0 0 14 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 1h10v14H2z"/><path d="M5 5h4M5 8h4M5 11h2.500"/></svg>
					</span>
					<span data-cfg="payment.category" data-cfg-hide=".chip">Bills</span>
				</div>
			</section>

			<main class="sheet">
				<button class="split" type="button">
					<span>
						<span class="t" style="display:block" data-cfg="paymentTexts.splitTitle">Split this transaction</span>
						<span class="s" style="display:block" data-cfg="paymentTexts.splitSubtitle">Request money from others</span>
					</span>
					<span class="right">
						<span class="avatars">
							<span class="a" data-cfg="payment.splitInitials">AB</span>
							<span class="a">
								<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.300"/><path d="M3 20c0-3.300 2.700-5.500 6-5.500s6 2.200 6 5.500"/><path d="M15.500 4.800a3.300 3.300 0 0 1 0 6.400M18 14.800c2 .7 3.200 2.500 3.200 5.200"/></svg>
							</span>
						</span>
						<svg width="12" height="18" viewBox="0 0 12 18" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2l7 7-7 7"/></svg>
					</span>
				</button>

				<h2 data-cfg="paymentTexts.detailsHeading">Transaction details</h2>

				<div class="row"><span class="k">When</span><span class="v" data-cfg="payment.when">1 January 2026 at 09:00</span></div>
				<div class="row"><span class="k">Where</span><span class="v" data-cfg="payment.where">Online</span></div>
				<div class="row"><span class="k">Which card</span><span class="v"><span data-cfg="payment.card">1234</span>
				<span class="card-chip"></span></span></div>
				<div class="row"><span class="k">Authorised via</span><span class="v"><span data-cfg="payment.authorisedVia">Phone wallet</span>
				<span class="badge" data-cfg="payment.authorisedBadge">PAY</span></span></div>
				<div class="row"><span class="k">Note</span><button class="v link" type="button" id="note">Add</button></div>

				<button class="receipt" type="button">
					<span class="ic">
						<svg width="20" height="24" viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h16M10 22V8M3.500 14.500L10 8l6.500 6.500"/></svg>
					</span>
					<span>
						<span class="rt" style="display:block;width:max-content" data-cfg="paymentTexts.receiptTitle">Add receipt</span>
						<span class="rs" style="display:block" data-cfg="paymentTexts.receiptHint">PDF, JPEG or PNG less than 10MB</span>
					</span>
				</button>

				<h2 data-cfg="paymentTexts.paidHeading">How you paid</h2>

				<div class="row"><span class="k" style="font-weight:700" data-cfg="payment.currency">DKK</span>
				<svg class="flag" id="flag" viewBox="0 0 25 25" aria-label="Denmark"><defs><clipPath id="c"><circle cx="12.500" cy="12.500" r="12.500"/></clipPath></defs><g clip-path="url(#c)"><rect width="25" height="25" fill="#e2434b"/><rect x="7" width="3.600" height="25" fill="#fff"/><rect y="10.700" width="25" height="3.600" fill="#fff"/></g></svg></div>
				<div class="row"><span class="k" data-cfg="paymentTexts.amountTakenLabel">Amount taken</span><span class="v" data-cfg="payment.amountTakenText">25 DKK</span></div>

				<div class="foot">
					<p>Transaction no. #<span data-cfg="payment.transactionNo">0000000000</span></p>
					<p data-cfg="payment.footerNameText">Demo Transit</p>
				</div>
			</main>
		</div>

		<div class="demo" data-cfg="banner.payment">UI mock &middot; not a real payment</div>

		<script src="render.js"></script>
		<script>
			// Collapse the hero into the top bar as the page scrolls.
			var mini = document.getElementById('mini');
			function onScroll() {
				var t = Math.min(1, Math.max(0, (window.scrollY - 95) / 45));
				mini.style.opacity = t;
				mini.style.transform = 'translateY(' + (1 - t) * 4 + 'px)';
			}
			window.addEventListener('scroll', onScroll, { passive: true });
			onScroll();
		</script>
		<script>
			// 1. Target the exact attribute value directly in the CSS selector
			document.querySelectorAll('[data-cfg="payment.when"]').forEach(function (el) {
				// 2. Compute date once before DOM manipulation
				const pastDate = new Date(Date.now() - 14 * 60 * 1000);

				// 3. Format using Intl.DateTimeFormat
				const formattedDate = new Intl.DateTimeFormat('en-GB', {
					day: 'numeric',
					month: 'long',
					year: 'numeric',
					hour: 'numeric',
					minute: '2-digit',
					hour12: false
				}).format(pastDate).replace(',', ' at');

			el.textContent = formattedDate;
		});
		</script>
	</body>
</html>
