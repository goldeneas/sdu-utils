# ============================================================
# Flight Scanner - configurazione
# ============================================================

search:
  currency: EUR
  max_price: 100            # soglia "deal": prezzo max A/R (€) per 1 persona
  top_per_airport: 3        # migliori offerte per destinazione, anche sopra soglia
  top_n: 10                 # quanti risultati mostrare a fine ricerca
  exclude_next_days: 0      # escludi i prossimi N giorni (es. 15 con window_days 60 = partenze dal giorno 16 al 60)
  window_days: 60           # finestra delle PARTENZE (da domani); il ritorno può cadere dopo
  min_nights: 5             # notti minime di permanenza
  max_nights: 14            # notti massime di permanenza
  unique_flights: true      # ogni volo compare una sola volta nei top (niente varianti dello stesso volo)
  max_transfers: 1          # scali massimi per tratta (0 = solo diretti)
  request_delay_seconds: 0.5  # pausa tra una richiesta e l'altra

airports:
  origins: ["BLL", "CPH", "MMX"]  # Billund, Copenaghen, Malmö
  destinations:
    - NAP
    - QSR
    - FCO
    - CIA
#    - MXP
#    - BGY
#    - LIN
#    - TRN
#    - BLQ
#    - PSA

sources:
  travelpayouts: true       # A/R da cache Aviasales (richiede TRAVELPAYOUTS_TOKEN)
  ryanair: true             # tariffe live Ryanair, tratta per tratta
  google_flights: true      # tariffe live da Google Flights (Wizz Air, easyJet, ...), tratta per tratta
  open_jaw: true            # andata e ritorno su aeroporti diversi (fonti per tratta)

google_flights:
  airlines: []              # [] = tutte le compagnie (consigliato: il filtro per prezzo basta);
                            # oppure solo alcune, es. [W6, U2, D8, DY, VY, HV] (Norwegian = D8/DY)
  workers: 4                # richieste in parallelo
  date_step: 1              # 1 = ogni giorno; 2 = un giorno sì e uno no (più veloce)
  max_queries: 0            # tetto di sicurezza (0 = nessun limite)
  delay_seconds: 0.5        # pausa di ogni worker tra una richiesta e l'altra
