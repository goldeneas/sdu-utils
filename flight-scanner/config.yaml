# ============================================================
# Flight Scanner - configurazione
# ============================================================

search:
  currency: EUR
  max_price: 100            # soglia "deal": prezzo max A/R (€) per 1 persona
  top_n: 10                 # quanti risultati mostrare a fine ricerca
  window_days: 30           # finestra di ricerca a partire da domani
  min_nights: 3             # notti minime di permanenza
  max_layover_hours: 3      # durata max scalo (best-effort)
  date_step_departure: 1    # passo in giorni tra le date di partenza testate
  date_step_return: 1       # passo in giorni tra le date di ritorno testate
  max_queries: 0            # tetto di sicurezza (0 = nessun limite)
  request_delay_seconds: 1.5  # pausa tra una ricerca e l'altra

airports:
  origins: ["BLL", "CPH"]
  destinations:
    - NAP
    - QSR
    - FCO
    - CIA
    - MXP
    - BGY
    - LIN
    - TRN
    - BLQ
    - PSA

ntfy:
  enabled: true             # false = nessuna notifica
  server: ntfy.sh           # sovrascrivibile con env NTFY_SERVER
  topic: ""                 # vuoto = letto da env NTFY_TOPIC
  notify_new_best: true     # notifica quando viene trovato un nuovo best deal

scraper:
  headless: true            # browser senza interfaccia
  timeout_seconds: 20       # timeout per il caricamento della pagina
  debug_dump_dir: ""        # se valorizzato salva HTML+screenshot

output:
  file: ""                  # es. "risultati.csv" (vuoto = solo terminale)
  format: csv               # csv | txt | json
