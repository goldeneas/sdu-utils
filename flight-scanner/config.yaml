# ============================================================
# Flight Scanner - configurazione
# ============================================================

search:
  currency: EUR
  max_price: 100            # soglia "deal": prezzo max A/R (€) per 1 persona
  top_n: 10                 # quanti risultati mostrare a fine ricerca
  window_days: 30           # finestra di ricerca a partire da domani
  min_nights: 3             # notti minime di permanenza
  max_nights: 14            # notti massime di permanenza
  unique_flights: true      # ogni volo compare una sola volta nei top (niente varianti dello stesso volo)
  max_transfers: 1          # scali massimi per tratta (0 = solo diretti)
  request_delay_seconds: 0.5  # pausa tra una richiesta e l'altra

airports:
  origins: ["BLL", "CPH"]
  destinations:
    - NAP
    - QSR
    - FCO
    - CIA
    - MXP
    - BGY
    - LIN
    - TRN
    - BLQ
    - PSA

sources:
  travelpayouts: true       # A/R da cache Aviasales (richiede TRAVELPAYOUTS_TOKEN)
  ryanair: true             # tariffe live Ryanair, tratta per tratta
  open_jaw: true            # andata e ritorno su aeroporti diversi (solo Ryanair)

ntfy:
  enabled: true             # false = nessuna notifica
  server: ntfy.sh           # sovrascrivibile con env NTFY_SERVER
  topic: ""                 # vuoto = letto da env NTFY_TOPIC
  notify_new_best: true     # notifica quando viene trovato un nuovo best deal

output:
  file: ""                  # es. "risultati.csv" (vuoto = solo terminale)
  format: csv               # csv | txt | json
