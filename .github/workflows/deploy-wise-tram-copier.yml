name: Deploy wise-tram-copier to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'wise-tram-copier/**'
      - '.github/workflows/deploy-wise-tram-copier.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Static site, no build step. Keep the module's folder name in the URL so other modules can be added next to it.
      - name: Stage site
        run: |
          mkdir -p _site
          cp -r wise-tram-copier _site/wise-tram-copier
          echo '<meta http-equiv="refresh" content="0; url=wise-tram-copier/">' > _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
